
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: krayin-crm:2.2-pristine
    container_name: krayin-crm-php
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - app-network
    ports:
      - "8082:80"
    env_file:
      - .env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://192.168.1.9:8082
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=dbmariadb
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-krayin-crm}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-}
      - MAIL_FROM_ADDRESS=laravel@leaddesk.local
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Krayin CRM}
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache

  dbmariadb:
    image: mariadb:11
    container_name: krayin-crm-mariadb
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_DATABASE:-krayin-crm}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-file-per-table=1

networks:
  app-network:
    driver: bridge
    name: krayin-crm-app

volumes:
  storage:
  bootstrap-cache:
  db-data:
