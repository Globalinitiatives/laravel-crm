# nginx site definition: serves the Laravel public/ dir over PHP-FPM
# via fastcgi on 127.0.0.1:9000
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Migrations can take >60s; give PHP-FPM ample time to respond
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME  /var/www/html/public/index.php;
            include fastcgi_params;
            # Read response body for up to 5 minutes (long-running migrations)
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;

            # Preserve the original Host header (with port) so Laravel
            # generates correct asset URLs when behind a port-mapped Docker setup.
            fastcgi_param HTTP_HOST $http_host;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/www/html/public;
        }
    }
}
